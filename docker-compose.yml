services:
  mail-manager:
    build: .
    ports:
      - "8000:8000"
    environment:
      AI_API_KEY: ${AI_API_KEY}
      AI_BASE_URL: ${AI_BASE_URL}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.2}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8000}
      MAX_EMAILS_DEFAULT: ${MAX_EMAILS_DEFAULT:-20}
      GMAIL_USER_ID: ${GMAIL_USER_ID:-me}
      GMAIL_CREDENTIALS_PATH: /secrets/credentials.json
      GMAIL_TOKEN_PATH: /secrets/token.json
    volumes:
      - ./secrets:/secrets
