services:
  backend:
    build:
      context: ./backend
    ports:
      - "3000:3000"
    environment:
      AI_API_KEY: ${AI_API_KEY}
      AI_BASE_URL: ${AI_BASE_URL}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.2}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      MAX_EMAILS_DEFAULT: ${MAX_EMAILS_DEFAULT:-20}
      GMAIL_USER_ID: ${GMAIL_USER_ID:-me}
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET}
      GMAIL_REDIRECT_URI: ${GMAIL_REDIRECT_URI:-http://localhost:3000/api/auth/google/callback}
      GMAIL_SCOPES: ${GMAIL_SCOPES}
      GMAIL_CREDENTIALS_PATH: /secrets/credentials.json
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-mm_session}
    volumes:
      - ./secrets:/secrets
      - ./backend:/app
      - backend_node_modules:/app/node_modules
  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY_TARGET: http://backend:3000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  backend_node_modules:
  frontend_node_modules:
